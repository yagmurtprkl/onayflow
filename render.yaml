databases:
  - name: onayflow-db
    databaseName: onayflow
    user: onayflow
    plan: free
    region: frankfurt
    ipAllowList: []

services:
  - type: web
    name: onayflow
    runtime: ruby
    plan: free
    region: frankfurt
    buildCommand: bash bin/render-build.sh
    startCommand: bundle exec puma -C config/puma.rb
    healthCheckPath: /up
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: onayflow-db
          property: connectionString
      - key: RAILS_MASTER_KEY
        sync: false
      - key: RAILS_ENV
        value: production
      - key: WEB_CONCURRENCY
        value: 2
